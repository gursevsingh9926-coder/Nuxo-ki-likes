services:
  - type: web
    name: freefire-like-api
    runtime: python
    repo: https://github.com/tera-username/tera-repo-name
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0